[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcmp-provider"
version = "1.0.0"
description = "SmartCMP Provider implementation shared by AtlasClaw Skills and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "requests>=2.32,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
